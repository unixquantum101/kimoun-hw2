# Deployed by Jenkins on the Swarm manager:
#   IMAGE=<account>.dkr.ecr.<region>.amazonaws.com/<repo>:<tag> \
#   docker stack deploy --with-registry-auth -c docker-stack.yml hw2

version: "3.8"
services:
  web:
    image: ${IMAGE}
    ports:
      - "80:5000"
    networks:
      - appnet
    deploy:
      replicas: 2
      # Prefer distributing replicas across different nodes
      placement:
        preferences:
          - spread: node.id
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 30s
      # Rolling update configuration
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
        monitor: 15s
      rollback_config:
        parallelism: 1
        order: stop-first
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 64M
networks:
  appnet:
    driver: overlay